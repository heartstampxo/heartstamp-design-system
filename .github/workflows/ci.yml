name: CI

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development

jobs:
  changelog:
    name: Changelog updated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every push and pull request must add an entry to the design system
      # changelog page. The rule lives in scripts/check-changelog.mjs.
      - name: Check changelog entry
        run: node scripts/check-changelog.mjs "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

  check:
    name: Typecheck, test, build, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run
